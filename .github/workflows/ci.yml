name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Download Xray and sing-box for integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cores && cd cores
          gh release download --repo XTLS/Xray-core --pattern 'Xray-linux-64.zip'
          unzip -q Xray-linux-64.zip
          gh release download --repo SagerNet/sing-box --pattern 'sing-box-*-linux-amd64.tar.gz'
          tar -xzf sing-box-*-linux-amd64.tar.gz --strip-components=1
          chmod +x xray sing-box
          ./xray version | head -1
          ./sing-box version | head -1
      - name: Tests (configs are validated by the real cores)
        run: cargo test --workspace
        env:
          XRAY_BIN: ${{ github.workspace }}/cores/xray
          SINGBOX_BIN: ${{ github.workspace }}/cores/sing-box

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch latest cores
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-cores.ps1
      - run: cargo test -p sybau-core --lib
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.no-updater.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: V2RaySybau-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
