name: Release

# Push a tag like v1.0.1 (or run this workflow from the Actions tab with a version) to publish
# a GitHub release with the NSIS installer. Installed apps notice the new release by themselves
# (GitHub Releases API) and show its notes; they do not update automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (the tag v<version> is created)'
        required: true
        default: '1.0.0'
      replace:
        description: 'Delete an existing release and tag with this version first (rebuild it)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version from tag
        shell: pwsh
        run: ./scripts/set-version.ps1 $env:TAG
      - name: Fetch latest cores
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-cores.ps1
      - name: Licenses of the bundled libraries
        run: |
          cargo fetch --target x86_64-pc-windows-msvc
          python scripts/third_party_licenses.py
      - name: Delete the existing release
        if: github.event_name == 'workflow_dispatch' && inputs.replace
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:TAG --repo ${{ github.repository }} --cleanup-tag --yes
          if ($LASTEXITCODE -ne 0) { Write-Warning "no release $env:TAG to delete" }
          $global:LASTEXITCODE = 0
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: V2Ray Sybau ${{ env.TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Установщик для Windows 10/11 (x64): скачайте `*-setup.exe` и запустите.
            В комплекте последние Xray-core, sing-box и geoip/geosite.
            Уже установленное приложение сообщит о новой версии при запуске и покажет, что изменилось.

            Код приложения — MIT. Сторонние компоненты и их лицензии: [THIRD-PARTY-NOTICES.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/THIRD-PARTY-NOTICES.md).
            Исходный код поставляемых версий sing-box и geo-данных (GPL-3.0) приложен к релизу ниже.
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          args: --bundles nsis
      # GPL-3.0 components (sing-box, geo data) are shipped as binaries: the complete source of
      # the exact versions goes with every release (THIRD-PARTY-NOTICES.md points here).
      - name: Attach the source of GPL components
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sources = Get-Content src-tauri/resources/licenses/sources.json -Raw | ConvertFrom-Json
          foreach ($s in (@($sources) | Where-Object { $_.attachSource })) {
            $name = ($s.repo -split '/')[1]
            $file = "$name-$($s.version)-source.tar.gz"
            Invoke-WebRequest -Uri $s.archive -OutFile $file -Headers @{ 'User-Agent' = 'v2raysybau-ci' }
            gh release upload $env:TAG $file --repo ${{ github.repository }} --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload of $file failed" }
          }
